<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Projektant domu</title>
<style>
:root{--bg:#f3f1ec;--ink:#1d2125;--mut:#6c7178;--line:#e0dbd1;--acc:#2563eb;--acc2:#c2410c;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;gap:6px;padding:7px 8px;background:#1d2125;color:#fff;flex:none}
header .ttl{font-weight:800;font-size:15px;white-space:nowrap}
header .ttl span{color:#60a5fa}
header select,header button{font:inherit;font-size:13px;border:none;border-radius:9px;padding:6px 8px;background:#2f353b;color:#fff}
header button:disabled{opacity:.35}
.seg{display:flex;border-radius:10px;overflow:hidden;background:#2f353b;margin-left:auto}
.seg button{background:transparent;border-radius:0;font-weight:700}
.seg button.on{background:#2563eb}
@media (max-width:520px){ header .ttl{display:none} header select{max-width:120px} }
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#f7f6f2}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#c3{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;background:linear-gradient(#cfe3f5,#eef4f8 60%)}
.hide{display:none!important}
#hint{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:rgba(29,33,37,.88);color:#fff;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:20px;pointer-events:none;max-width:92%;text-align:center;z-index:3}
#tb{flex:none;display:flex;gap:4px;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);background:#fff;border-top:1px solid var(--line);overflow-x:auto}
#tb button{flex:1 0 auto;min-width:52px;display:flex;flex-direction:column;align-items:center;gap:1px;border:none;background:transparent;border-radius:10px;padding:5px 6px;font:600 11px system-ui;color:var(--mut)}
#tb button b{font-size:19px;line-height:1.1}
#tb button.on{background:#e8efff;color:var(--acc)}
#tb button.add{background:var(--acc);color:#fff}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:46%;overflow:auto;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.15);padding:10px 12px 12px;z-index:4}
#sheet h3{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:8px;padding-right:44px}
#sheet.min > *:not(h3):not(#shT){display:none}
#sheet.min h3{margin:0}
#shT{position:absolute;right:10px;top:8px;width:34px;height:28px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:15px}
#sheet h3 small{color:var(--mut);font-weight:500}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
label{display:flex;flex-direction:column;font-size:11.5px;color:var(--mut);gap:2px}
input,select{font:inherit;font-size:15px;color:var(--ink);background:#faf9f6;border:1px solid var(--line);border-radius:8px;padding:6px 7px;width:100%}
input[type=color]{padding:2px;height:34px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.btn{font:inherit;font-weight:650;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;color:var(--ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.del{color:#dc2626}
.btn.on{background:#e8efff;border-color:#93b4fb;color:var(--acc)}
#cat{position:absolute;inset:0;z-index:6;background:rgba(20,22,25,.5);display:flex;align-items:flex-end}
#cat .box{background:#fff;width:100%;max-height:82%;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
#catTabs{display:flex;gap:4px;overflow-x:auto;padding:10px 10px 6px;flex:none}
#catTabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 11px;font:600 13px system-ui;white-space:nowrap}
#catTabs button.on{background:#1d2125;color:#fff;border-color:#1d2125}
#catGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;padding:6px 10px 16px;overflow:auto}
#catGrid button{border:1px solid var(--line);background:#faf9f6;border-radius:12px;padding:6px 4px;font:600 11.5px system-ui;display:flex;flex-direction:column;align-items:center;gap:3px}
#catGrid svg{width:64px;height:52px}
#catGrid small{color:var(--mut);font-weight:500;font-size:10.5px}
.modal{position:absolute;inset:0;z-index:7;background:rgba(20,22,25,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:#fff;border-radius:16px;padding:14px;width:min(420px,100%);max-height:86%;overflow:auto}
.modal h3{margin:0 0 8px}
.modal textarea{width:100%;min-height:120px;font:12px monospace;border:1px solid var(--line);border-radius:8px;padding:6px}
.mi{display:block;width:100%;text-align:left;margin-top:6px}
.lvRow{display:flex;gap:6px;align-items:end;margin-bottom:6px}
.lvRow label{flex:1}
#zoomBtns{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
#zoomBtns button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:700}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="ttl">Projektant <span>domu</span></div>
  <select id="lvSel" title="piętro"></select>
  <button id="undo" title="Cofnij">↶</button><button id="redo" title="Ponów">↷</button>
  <div class="seg"><button id="v2" class="on">Plan</button><button id="v3">3D</button></div>
  <button id="menuB">≡</button>
</header>
<div id="stage">
  <svg id="svg"></svg>
  <canvas id="c3" class="hide"></canvas>
  <div id="hint" class="hide"></div>
  <div id="zoomBtns"><button id="zIn">+</button><button id="zOut">−</button><button id="zFit" style="font-size:13px">⤢</button></div>
  <div id="sheet" class="hide"></div>
  <div id="cat" class="hide"><div class="box"><div style="display:flex;align-items:center;padding:10px 12px 0"><b style="font-size:16px">Dodaj do projektu</b><button class="btn" id="catX" style="margin-left:auto">✕</button></div><div id="catTabs"></div><div id="catGrid"></div></div></div>
  <div id="modal" class="modal hide"><div class="box" id="mBox"></div></div>
</div>
<div id="tb"></div>
</div>

<script>
// ======================= Projektant domu =======================
const $ = id=>document.getElementById(id);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const D2R = Math.PI/180;
const esc = s=>String(s ?? '').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = (v,d)=>{ const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : d; };
const fmtM = cm=>(cm/100).toFixed(2).replace('.', ',');

// ---------- catalog (cm; w = width, d = depth, h = height, z = height above the floor) ----------
const CAT = [
 { id:'kuch', n:'Kuchnia', items:[
  ['szafka_d','Szafka dolna',60,60,90,0,'#efe9df'], ['szafka_d40','Szafka dolna 40',40,60,90,0,'#efe9df'], ['szafka_g','Szafka górna',60,35,70,145,'#efe9df'], ['szafka_w','Słupek / zabudowa',60,60,215,0,'#efe9df'],
  ['zlew','Szafka ze zlewem',80,60,90,0,'#efe9df'], ['kuchenka','Kuchenka / płyta',60,60,90,0,'#efe9df'], ['zmywarka','Zmywarka',60,60,90,0,'#e5e7eb'], ['lodowka','Lodówka',60,65,185,0,'#f1f5f9'],
  ['okap','Okap',60,50,45,150,'#cbd5e1'], ['wyspa','Wyspa kuchenna',180,90,90,0,'#efe9df'], ['stol','Stół',160,90,75,0,'#a47551'], ['stol_o','Stół okrągły',110,110,75,0,'#a47551'], ['krzeslo','Krzesło',45,50,90,0,'#7c5a3c'], ['hoker','Hoker',40,40,75,0,'#57534e'] ]},
 { id:'laz', n:'Łazienka', items:[
  ['wanna','Wanna',170,75,58,0,'#f8fafc'], ['prysznic','Prysznic',90,90,200,0,'#e0f2fe'], ['wc','WC',38,65,80,0,'#f8fafc'], ['umywalka','Umywalka z szafką',60,45,85,0,'#f8fafc'],
  ['pralka','Pralka',60,60,85,0,'#f1f5f9'], ['suszarka','Suszarka',60,62,85,0,'#f1f5f9'], ['grzejnik_l','Grzejnik łazienkowy',50,8,120,20,'#e5e7eb'], ['lustro','Lustro',80,4,70,110,'#cfe8f5'] ]},
 { id:'salon', n:'Salon', items:[
  ['sofa','Sofa',220,95,85,0,'#64748b'], ['naroznik','Narożnik',270,180,85,0,'#64748b'], ['fotel','Fotel',85,85,85,0,'#94a3b8'], ['stolik','Stolik kawowy',110,60,45,0,'#a47551'],
  ['rtv','Szafka RTV',180,45,50,0,'#d6cfc4'], ['tv','Telewizor',140,8,82,70,'#111827'], ['regal','Regał',100,35,200,0,'#d6cfc4'], ['dywan','Dywan',200,140,1,0,'#b4a48c'],
  ['kominek','Kominek',120,55,115,0,'#78716c'], ['lampa','Lampa stojąca',40,40,170,0,'#fde68a'], ['roslina','Roślina',45,45,130,0,'#16a34a'] ]},
 { id:'syp', n:'Sypialnia', items:[
  ['lozko160','Łóżko 160',160,205,55,0,'#cbd5e1'], ['lozko90','Łóżko 90',90,200,50,0,'#cbd5e1'], ['szafa','Szafa',200,62,225,0,'#e7dfd3'], ['komoda','Komoda',100,45,85,0,'#d6cfc4'],
  ['nocna','Szafka nocna',45,40,55,0,'#d6cfc4'], ['biurko','Biurko',120,60,75,0,'#c8b39a'], ['krzeslo_b','Krzesło biurowe',60,60,100,0,'#334155'] ]},
 { id:'tech', n:'Technika', items:[
  ['kociol','Kocioł',44,35,72,120,'#f8fafc'], ['zasobnik','Zasobnik CWU',60,60,140,0,'#f1f5f9'], ['bufor','Bufor',80,80,190,0,'#e2e8f0'], ['grzejnik','Grzejnik',100,10,60,15,'#f1f5f9'],
  ['klima','Klimatyzator',85,25,30,215,'#f8fafc'], ['schody','Schody',100,300,270,0,'#a47551'], ['blok','Dowolny obiekt',60,60,100,0,'#a8a29e'] ]},
 { id:'ogrod', n:'Ogród', items:[
  ['drzewo','Drzewo',350,350,650,0,'#3f7d32'], ['iglak','Iglak',200,200,500,0,'#2f5d2a'], ['krzew','Krzew',110,110,100,0,'#4d8a3a'], ['auto','Samochód',460,185,150,0,'#2563eb'],
  ['lawka','Ławka',150,55,85,0,'#8b5e3c'], ['stol_ogr','Stół ogrodowy',180,90,75,0,'#8b5e3c'], ['lezak','Leżak',70,180,40,0,'#e7e5e4'], ['basen','Basen',400,800,140,0,'#38bdf8'],
  ['plot','Płot (odcinek)',250,6,150,0,'#6b7280'], ['taras','Taras / kostka',400,300,5,0,'#c8bfae'] ]},
];
const CI = {}; CAT.forEach(c=>c.items.forEach(([t,n,w,d,h,z,col])=>CI[t] = { t, n, w, d, h, z, col, cat:c.id }));

// ---------- state ----------
const KEY = 'domplan_v1';
let P = null, hist = [], fut = [];
function blank(){ return { name:'Mój dom', seq:1, cur:'L1', levels:[{ id:'L1', name:'Parter', h:270 }], walls:[], rooms:[], ops:[], items:[], roof:{ type:'gable', pitch:35, col:'#7f2d1d', over:40 }, ext:{ wall:'#efe7da', ground:'#86a95f' } }; }
const uid = p=>p + (P.seq++);
function save(){ try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e){} }
function snap(){ hist.push(JSON.stringify(P)); if (hist.length > 80) hist.shift(); fut.length = 0; updUndo(); }
function updUndo(){ $('undo').disabled = !hist.length; $('redo').disabled = !fut.length; }
$('undo').onclick = ()=>{ if (!hist.length) return; fut.push(JSON.stringify(P)); P = JSON.parse(hist.pop()); sel = null; afterChange(); };
$('redo').onclick = ()=>{ if (!fut.length) return; hist.push(JSON.stringify(P)); P = JSON.parse(fut.pop()); sel = null; afterChange(); };

// ---------- levels ----------
const lvIdx = id=>P.levels.findIndex(l=>l.id===id);
function lvElev(id){ let e = 0; for (const l of P.levels){ if (l.id===id) return e; e += l.h + 25; } return e; }
const curLv = ()=>P.levels.find(l=>l.id===P.cur) || P.levels[0];
function renderLevels(){ $('lvSel').innerHTML = P.levels.map(l=>`<option value="${l.id}"${l.id===P.cur?' selected':''}>${esc(l.name)}</option>`).join('') + '<option value="__edit">Piętra…</option>'; }
$('lvSel').onchange = ()=>{ const v = $('lvSel').value; if (v==='__edit'){ renderLevels(); levelsModal(); return; } P.cur = v; sel = null; save(); afterChange(); };

// ---------- geometry ----------
const dist = (a,b)=>Math.hypot(a.x-b.x, a.y-b.y);
function proj(p, a, b){ const dx = b.x-a.x, dy = b.y-a.y, L2 = dx*dx + dy*dy || 1, t = ((p.x-a.x)*dx + (p.y-a.y)*dy)/L2, tc = clamp(t, 0, 1), x = a.x + dx*tc, y = a.y + dy*tc;
  const L = Math.sqrt(L2), side = ((p.x-a.x)*dy - (p.y-a.y)*dx)/L; return { t, tc, x, y, d:Math.hypot(p.x-x, p.y-y), side, L }; }
function inPoly(p, pts){ let c = false; for (let i=0, j=pts.length-1; i<pts.length; j=i++){ const a = pts[i], b = pts[j]; if (((a.y>p.y) !== (b.y>p.y)) && (p.x < (b.x-a.x)*(p.y-a.y)/(b.y-a.y) + a.x)) c = !c; } return c; }
function area(pts){ let s = 0; for (let i=0; i<pts.length; i++){ const a = pts[i], b = pts[(i+1)%pts.length]; s += a.x*b.y - b.x*a.y; } return Math.abs(s)/2; }
function centroid(pts){ let x = 0, y = 0; pts.forEach(p=>{ x += p.x; y += p.y; }); return { x:x/pts.length, y:y/pts.length }; }
function itemCorners(it){ const c = Math.cos(it.rot*D2R), s = Math.sin(it.rot*D2R), hw = it.w/2, hd = it.d/2;
  return [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]].map(([x,y])=>({ x:it.x + x*c - y*s, y:it.y + x*s + y*c })); }
function inItem(p, it){ const c = Math.cos(-it.rot*D2R), s = Math.sin(-it.rot*D2R), dx = p.x - it.x, dy = p.y - it.y, lx = dx*c - dy*s, ly = dx*s + dy*c; return Math.abs(lx) <= it.w/2 && Math.abs(ly) <= it.d/2; }
const lvWalls = (id=P.cur)=>P.walls.filter(w=>w.lv===id);
const lvItems = (id=P.cur)=>P.items.filter(i=>i.lv===id);
const lvRooms = (id=P.cur)=>P.rooms.filter(r=>r.lv===id);
const wallOps = w=>P.ops.filter(o=>o.wall===w.id);

// a new wall is skipped when an existing one already covers the same segment
function covered(a, b){ return lvWalls().some(w=>{ const p1 = proj(a, w.a, w.b), p2 = proj(b, w.a, w.b); return p1.d < 3 && p2.d < 3 && p1.t > -0.02 && p1.t < 1.02 && p2.t > -0.02 && p2.t < 1.02; }); }
function addWall(a, b, t){ if (dist(a, b) < 5 || covered(a, b)) return null; const w = { id:uid('w'), lv:P.cur, a:{ x:a.x, y:a.y }, b:{ x:b.x, y:b.y }, t }; P.walls.push(w); return w; }
function addRoom(pts, name, t, floor){ const r = { id:uid('r'), lv:P.cur, name:name || 'Pokój', pts:pts.map(p=>({ x:p.x, y:p.y })), floor:floor || '#d8c3a5' }; P.rooms.push(r);
  pts.forEach((p,i)=>addWall(p, pts[(i+1)%pts.length], t)); return r; }
function addOp(w, pos, kind){ const L = dist(w.a, w.b), def = kind==='win' ? { w:120, h:140, sill:90 } : kind==='slide' ? { w:200, h:220, sill:0 } : kind==='pass' ? { w:90, h:210, sill:0 } : { w:90, h:205, sill:0 };
  const o = Object.assign({ id:uid('o'), wall:w.id, kind, pos:clamp(pos, def.w/2 + 5, L - def.w/2 - 5), flip:false, hinge:false }, def); P.ops.push(o); return o; }
function addItem(t, x, y){ const c = CI[t], it = { id:uid('i'), lv:P.cur, t, name:c.n, x, y, rot:0, w:c.w, d:c.d, h:t==='schody' ? curLv().h + 25 : c.h, z:c.z, col:c.col }; P.items.push(it); return it; }

// ---------- template ----------
function template(){
  P = blank(); P.walls = []; const T = 35, t = 12;
  addRoom([{x:0,y:0},{x:1100,y:0},{x:1100,y:900},{x:0,y:900}], 'Dom', T, '#e7dccb'); P.rooms = [];
  addRoom([{x:0,y:0},{x:650,y:0},{x:650,y:520},{x:0,y:520}], 'Salon z kuchnią', t, '#c9a77c');
  addRoom([{x:650,y:0},{x:1100,y:0},{x:1100,y:420},{x:650,y:420}], 'Sypialnia', t, '#d8c3a5');
  addRoom([{x:800,y:420},{x:1100,y:420},{x:1100,y:900},{x:800,y:900}], 'Pokój', t, '#d8c3a5');
  addRoom([{x:0,y:520},{x:330,y:520},{x:330,y:900},{x:0,y:900}], 'Łazienka', t, '#c7d2dc');
  addRoom([{x:330,y:520},{x:800,y:520},{x:800,y:900},{x:330,y:900}], 'Hol', t, '#d6cbb8');
  addRoom([{x:650,y:420},{x:800,y:420},{x:800,y:520},{x:650,y:520}], 'Korytarz', t, '#d6cbb8');
  const W = (a, b)=>P.walls.find(w=>proj(a, w.a, w.b).d < 2 && proj(b, w.a, w.b).d < 2);
  const op = (a, b, pos, kind, extra)=>{ const w = W(a, b); if (w){ const o = addOp(w, pos, kind); Object.assign(o, extra || {}); } };
  op({x:0,y:0},{x:1100,y:0}, 200, 'win', { w:180 }); op({x:0,y:0},{x:1100,y:0}, 470, 'win', { w:150 }); op({x:0,y:0},{x:1100,y:0}, 870, 'win', { w:150 });
  op({x:0,y:0},{x:0,y:900}, 260, 'slide', { w:240 }); op({x:1100,y:0},{x:1100,y:900}, 650, 'win', { w:140 }); op({x:0,y:0},{x:0,y:900}, 700, 'win', { w:80, h:80, sill:130 });
  op({x:0,y:900},{x:1100,y:900}, 560, 'door', { w:100 });
  op({x:330,y:520},{x:330,y:900}, 280, 'door', { w:80 }); op({x:650,y:420},{x:650,y:520}, 50, 'pass', { w:90 }); op({x:650,y:420},{x:1100,y:420}, 75, 'door', { w:90 });
  op({x:800,y:420},{x:800,y:900}, 300, 'door', { w:90 }); op({x:330,y:520},{x:800,y:520}, 200, 'pass', { w:120 });
  const I = (t, x, y, rot)=>{ const it = addItem(t, x, y); it.rot = rot || 0; return it; };
  [30, 90, 150, 210].forEach(x=>I(x===90 ? 'zlew' : x===150 ? 'kuchenka' : 'szafka_d', x + 18, 48)); I('lodowka', 278, 51); I('szafka_g', 48, 35); I('szafka_g', 228, 35); I('okap', 168, 43);
  I('stol', 200, 260); I('krzeslo', 160, 205); I('krzeslo', 240, 205); I('krzeslo', 160, 315, 180); I('krzeslo', 240, 315, 180);
  I('dywan', 470, 290); I('naroznik', 480, 400, 180); I('stolik', 470, 280); I('rtv', 480, 150); I('tv', 480, 145); I('roslina', 615, 60);
  I('lozko160', 875, 120); I('nocna', 770, 38); I('nocna', 980, 38); I('szafa', 880, 383, 180); I('lozko90', 982, 700, 90); I('biurko', 900, 852, 180); I('krzeslo_b', 900, 800);
  I('wanna', 100, 564); I('wc', 291, 640, 90); I('umywalka', 301, 760, 90); I('pralka', 50, 852, 180);
  I('drzewo', -420, 750); I('iglak', 1350, 1100); I('krzew', -150, 1050); I('auto', 300, 1250); I('taras', -200, 260);
  P.cur = 'L1'; return P;
}

// ---------- view / UI state ----------
let view = '2d', tool = 'sel', sel = null, wallT = 12, magnet = true;
const V = { x:40, y:60, s:0.6 };   // 2D: screen = world*s + offset
let draft = null;              // drawing in progress
let roomShape = 'rect';        // rect | L | U | T | free
// room outlines; (x0, y0) = top-left corner, A = width, B = depth, c / d = size of the cut-out (L, U) or of the stem / bar (T)
function shapePts(shape, x0, y0, A, B, c, d, corner){ let p;
  if (shape==='L') p = [[0,0],[A-c,0],[A-c,d],[A,d],[A,B],[0,B]];
  else if (shape==='U'){ const m0 = (A-c)/2, m1 = m0 + c; p = [[0,0],[m0,0],[m0,d],[m1,d],[m1,0],[A,0],[A,B],[0,B]]; }
  else if (shape==='T'){ const m0 = (A-c)/2, m1 = m0 + c; p = [[0,0],[A,0],[A,d],[m1,d],[m1,B],[m0,B],[m0,d],[0,d]]; }

      [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>{ const m = new THREE.Mesh(new THREE.CylinderGeometry(0.33, 0.33, 0.22, 22), mat('#111')); m.rotation.x = Math.PI/2; m.position.set(a*w*0.3*M3, 0.33, b*(d/2 - 12)*M3); g.add(m); }); break;
    case 'lawka': B(0, 42, 0, w, 5, d*0.7, c); B(0, 47, -d/2 + 4, w, 38, 4, c); [-1,1].forEach(a=>B(a*(w/2 - 8), 0, 0, 6, 42, d*0.7, '#374151')); break;
    case 'lezak': B(0, 25, 20, w, 6, d - 50, c); { const m = B(0, 30, -d/2 + 30, w, 6, 60, c); m.rotation.x = -0.6; } legs(25, 6, '#9ca3af'); break;
    case 'basen': B(0, 0, 0, w, h*0.08, d, '#e7e5e4'); B(0, h*0.08, 0, w - 30, 2, d - 30, c, { transparent:true, opacity:0.85, roughness:0.1 }); break;
    case 'plot': for (let x = -w/2; x <= w/2 + 0.1; x += 125) B(x, 0, 0, 8, h, 8, '#374151'); for (let x = -w/2 + 6; x < w/2; x += 12) B(x, 5, 0, 4, h - 10, 2, c); break;
    case 'taras': B(0, 0, 0, w, h, d, c, { roughness:1 }); break;
    default: B(0, 0, 0, w, h, d, c);
  }
}

// ---------- 3D camera / interaction ----------
function resize3(){ if (!T3) return; const r = $('stage').getBoundingClientRect(); T3.renderer.setSize(r.width, r.height, false); T3.camera.aspect = r.width/Math.max(1, r.height); T3.camera.updateProjectionMatrix(); }
window.addEventListener('resize', ()=>{ resize3(); render2D(); });
function setWalk(){ if (!T3) return; if (walk){ T3.ph = Math.PI/2 - 0.05; T3.dist = 0.01; T3.tgt.y = lvElev(P.cur)*M3 + 1.6; hint('Spacer: jeden palec – rozglądanie się, dwa palce – idź do przodu / do tyłu.', 4000); } else { T3.ph = 0.9; T3.dist = 18; T3.tgt.y = 1.2; } }
function loop(){ if (looping) return; looping = true; const f = ()=>{ if (view !== '3d' || !T3){ looping = false; return; }
  T3.ph = clamp(T3.ph, 0.08, walk ? 2.6 : 1.52); const t = T3.tgt, d = Math.max(0.01, T3.dist);
  const cp = new THREE.Vector3(t.x + d*Math.sin(T3.ph)*Math.cos(T3.th), t.y + d*Math.cos(T3.ph), t.z + d*Math.sin(T3.ph)*Math.sin(T3.th));
  if (walk){ T3.camera.position.copy(t); T3.camera.lookAt(t.x - Math.sin(T3.ph)*Math.cos(T3.th), t.y - Math.cos(T3.ph), t.z - Math.sin(T3.ph)*Math.sin(T3.th)); }
  else { T3.camera.position.copy(cp); T3.camera.lookAt(t); }
  T3.sun.target.position.copy(t); T3.sun.position.set(t.x - 12, t.y + 22, t.z - 8);
  T3.renderer.render(T3.scene, T3.camera); requestAnimationFrame(f); }; requestAnimationFrame(f); }
function attach3D(cv){ const pts = new Map(); let pinch = null, moved = 0, t0 = 0, drag3 = null;
  const ray = e=>{ const r = cv.getBoundingClientRect(), v = new THREE.Vector2((e.clientX - r.left)/r.width*2 - 1, -(e.clientY - r.top)/r.height*2 + 1), rc = new THREE.Raycaster(); rc.setFromCamera(v, T3.camera); return rc; };
  const floorHit = (e, it)=>{ const h = new THREE.Vector3(), y = (lvElev(it.lv) + 0)*M3; return ray(e).ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), -y), h) ? h : null; };
  cv.addEventListener('pointerdown', e=>{ pts.set(e.pointerId, { x:e.clientX, y:e.clientY }); try { cv.setPointerCapture(e.pointerId); } catch(_){} moved = 0; t0 = performance.now(); drag3 = null;
    if (pts.size === 1 && !walk){ const hit = ray(e).intersectObjects(T3.pick)[0]; if (hit && sel && sel.k==='item' && sel.id===hit.object.userData.item){ const it = P.items.find(x=>x.id===hit.object.userData.item), h = floorHit(e, it); if (h) drag3 = { it, off:{ x:h.x*100 - it.x, y:h.z*100 - it.y }, snapped:false }; } }
    if (pts.size === 2){ drag3 = null; const [a, b] = [...pts.values()]; pinch = { d:Math.hypot(a.x - b.x, a.y - b.y), m:{ x:(a.x + b.x)/2, y:(a.y + b.y)/2 } }; } });
  cv.addEventListener('pointermove', e=>{ const p = pts.get(e.pointerId); if (!p) return; const dx = e.clientX - p.x, dy = e.clientY - p.y; moved += Math.abs(dx) + Math.abs(dy); p.x = e.clientX; p.y = e.clientY;
    if (drag3 && pts.size === 1){ if (moved < 6) return; if (!drag3.snapped){ snap(); drag3.snapped = true; } const h = floorHit(e, drag3.it); if (!h) return; drag3.it.x = Math.round(h.x*100 - drag3.off.x); drag3.it.y = Math.round(h.z*100 - drag3.off.y); if (magnet) toWall(drag3.it);
      if (!drag3.raf) drag3.raf = requestAnimationFrame(()=>{ if (drag3) drag3.raf = 0; build3D(); }); return; }
    if (pts.size === 1){ T3.th += dx*0.008*(walk ? -0.6 : 1); T3.ph += (walk ? 1 : -1)*dy*0.006*(walk ? 0.6 : 1); }
    if (pts.size === 2 && pinch){ const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y), m = { x:(a.x + b.x)/2, y:(a.y + b.y)/2 };
      if (walk){ const step = (d - pinch.d)*0.02; T3.tgt.x -= Math.cos(T3.th)*step; T3.tgt.z -= Math.sin(T3.th)*step; }
      else { T3.dist = clamp(T3.dist*pinch.d/d, 2, 120); const k = T3.dist*0.0016, mx = m.x - pinch.m.x, my = m.y - pinch.m.y, sn = Math.sin(T3.th), cs = Math.cos(T3.th);
        T3.tgt.x += (-sn*mx - cs*my)*k; T3.tgt.z += (cs*mx - sn*my)*k; }
      pinch = { d, m }; } });
  const up = e=>{ pts.delete(e.pointerId); if (pts.size < 2) pinch = null;
    if (drag3){ const was = drag3.snapped; drag3 = null; if (was){ afterChange(); return; } }
    if (moved < 8 && performance.now() - t0 < 450 && !walk){ const hit = ray(e).intersectObjects(T3.pick)[0]; sel = hit ? { k:'item', id:hit.object.userData.item } : null; renderSheet(); build3D(); if (hit) hint('Przeciągnij zaznaczony mebel, żeby go przesunąć.', 2000); } };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', e=>{ pts.delete(e.pointerId); pinch = null; drag3 = null; });
  cv.addEventListener('wheel', e=>{ e.preventDefault(); T3.dist = clamp(T3.dist*(1 + Math.sign(e.deltaY)*0.1), 2, 120); }, { passive:false }); }

// ---------- start ----------
try { P = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){ P = null; }
if (!P || !P.levels) template();
renderLevels(); renderTB(); updUndo();
requestAnimationFrame(()=>{ fit(); renderSheet(); hint('Przykładowy dom – zmieniaj go albo zacznij od nowa (≡). Przełącz na 3D u góry.', 4500); });
</script>
